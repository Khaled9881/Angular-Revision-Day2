<p>task-form works!</p>
<form class="form" (ngSubmit)="onSubmit()">
  <div>
    <label for="TaskTitle">Task Title</label>
    <input
      type="text"
      id="TaskTitle"
      name="TaskTitle"
      (input)="onTitleChanged($event.target.value)"
    />
  </div>

  <div>
    <label for="Describtion">Task Describtion</label>
    <input type="text" id="Describtion" name="Describtion" [(ngModel)]="task.Describtion" />
  </div>

  <div class="mb-4">
    <input type="radio" id="Low" name="Priority" value="Low" [(ngModel)]="task.Priority" />
    <label for="Low" class="me-3">Low</label>
    <input type="radio" id="Medium" name="Priority" value="Medium" [(ngModel)]="task.Priority" />
    <label for="Medium" class="me-3">Medium</label>
    <input type="radio" id="High" name="Priority" value="High" [(ngModel)]="task.Priority" />
    <label for="High" class="me-3">High</label>
  </div>

  <div class="mb-4">
    <input type="radio" id="done" name="isdone" [value]="true" [(ngModel)]="task.IsDone" />
    <label for="done" class="me-3">done</label>

    <input type="radio" id="notdone" name="isdone" [value]="false" [(ngModel)]="task.IsDone" />
    <label for="notdone" class="me-3">Not done</label>
  </div>

  <div>
    <label for="Due">Low</label>
    <input type="date" id="Due" name="DueDate" [(ngModel)]="task.DueDate" />
  </div>

  <div>
    <input type="submit" />
  </div>
</form>
